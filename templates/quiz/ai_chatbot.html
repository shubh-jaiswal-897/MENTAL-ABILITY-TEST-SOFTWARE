<!-- Cyberpunk Glassmorphism Floating AI Chatbot Widget -->
<div id="aiChatbotContainer" class="ai-chatbot-wrapper">
  <!-- Launcher Button -->
  <button id="aiChatLauncher" class="ai-launcher-btn" onclick="toggleAiChatbot()" title="Open Brain AI Tutor">
    <div class="ai-launcher-glow"></div>
    <div class="ai-launcher-icon">
      <i class="fas fa-brain-circuit"></i>
      <i class="fas fa-brain"></i>
    </div>
    <div class="ai-launcher-text-box d-none d-md-flex flex-column text-start ms-2 me-1">
      <span class="ai-launcher-title font-monospace fw-extrabold">Brain AI</span>
      <span class="ai-launcher-sub font-monospace">Cognitive Tutor</span>
    </div>
    <span id="aiStatusDot" class="ai-status-pulse online" title="Brain AI Ready"></span>
  </button>

  <!-- Glassmorphism Chat Panel -->
  <div id="aiChatWindow" class="ai-chat-window d-none">
    <!-- Chat Header -->
    <div class="ai-chat-header d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
      <div class="d-flex align-items-center gap-2">
        <div class="ai-avatar-orb">
          <i class="fas fa-brain"></i>
          <span class="orb-ring"></span>
        </div>
        <div>
          <h6 class="mb-0 fw-extrabold font-monospace text-glow-amber">Brain AI</h6>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm ai-header-icon-btn text-muted hover-amber" onclick="clearAiChat()"
          title="Clear Chat History">
          <i class="fas fa-trash-alt"></i>
        </button>

        <button class="btn btn-sm ai-header-icon-btn text-muted hover-danger" onclick="toggleAiChatbot()"
          title="Close Chat">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Quick Chips Bar -->
    <div class="ai-chips-bar px-3 py-2 d-flex gap-2 overflow-x-auto">
      <button class="badge ai-chip-neon"
        onclick="sendQuickPrompt('Explain syllogisms with a clear Euler diagram example.')">
        <i class="fas fa-project-diagram me-1 text-info"></i> Syllogisms
      </button>
      <button class="badge ai-chip-neon"
        onclick="sendQuickPrompt('What is the train speed & distance conversion formula?')">
        <i class="fas fa-subway me-1 text-warning"></i> Speed Formula
      </button>
      <button class="badge ai-chip-neon" onclick="sendQuickPrompt('Give me a high-yield logical reasoning puzzle.')">
        <i class="fas fa-puzzle-piece me-1 text-success"></i> Aptitude Puzzle
      </button>
      <button class="badge ai-chip-neon"
        onclick="sendQuickPrompt('Give me 3 mental math tricks for fast calculation.')">
        <i class="fas fa-bolt me-1 text-amber"></i> Fast Math
      </button>
      <button class="badge ai-chip-neon"
        onclick="sendQuickPrompt('How do I solve coding & decoding alphabet shift questions?')">
        <i class="fas fa-font me-1 text-danger"></i> Coding Shift
      </button>
    </div>

    <!-- Chat Messages Container -->
    <div id="aiChatMessages" class="ai-chat-messages p-3">
      <!-- Welcome Message -->
      <div class="ai-msg assistant-msg fade-in">
        <div class="msg-avatar-glow"><i class="fas fa-brain"></i></div>
        <div class="msg-bubble assistant-bubble">
          <div class="bubble-header d-flex justify-content-between align-items-center mb-1">
            <span class="font-monospace fw-bold fs-xs text-amber"><i class="fas fa-sparkles me-1"></i> Brain AI</span>
            <small class="text-muted font-monospace fs-xs">System Online</small>
          </div>
          Hello! I'm <strong>Brain AI</strong>, your interactive cognitive & mental ability tutor. 🧠✨
          <br><br>
          I can help you master <strong>logical reasoning</strong>, <strong>quantitative aptitude</strong>,
          <strong>speed-distance formulas</strong>, and <strong>mental math shortcuts</strong>!
        </div>
      </div>
    </div>

    <!-- Typing Wave Indicator -->
    <div id="aiTypingIndicator" class="ai-typing-bar px-3 py-2 d-none">
      <div class="msg-avatar-glow"><i class="fas fa-brain"></i></div>
      <div class="wave-bars ms-2">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
      </div>
      <small class="font-monospace text-muted ms-2 fs-xs">Brain AI is computing step-by-step logic...</small>
    </div>

    <!-- Input Footer -->
    <div class="ai-chat-footer p-2 border-top">
      <form id="aiChatForm" onsubmit="handleAiChatSubmit(event)" class="d-flex align-items-center gap-2">
        <div class="input-wrapper flex-grow-1">
          <textarea id="aiChatInput" class="form-control ai-input-glow" rows="1"
            placeholder="Ask BrainBot any question or formula..." onkeydown="handleAiInputKeydown(event)"></textarea>
        </div>
        <button type="submit" id="aiSendBtn" class="btn ai-send-gradient-btn" title="Send Message (Enter)">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  let aiConversationHistory = [];
  let currentAiModel = 'brain-ai';

  document.addEventListener('DOMContentLoaded', function () {
    loadAiChatHistory();
    checkOllamaStatus();
  });

  function toggleAiChatbot() {
    const win = document.getElementById('aiChatWindow');
    if (win.classList.contains('d-none')) {
      win.classList.remove('d-none');
      document.getElementById('aiChatInput').focus();
      scrollToBottom();
    } else {
      win.classList.add('d-none');
    }
  }

  function openAiChatWithPrompt(promptText) {
    const win = document.getElementById('aiChatWindow');
    if (win.classList.contains('d-none')) {
      win.classList.remove('d-none');
    }
    const input = document.getElementById('aiChatInput');
    input.value = promptText;
    input.focus();
    scrollToBottom();
  }

  async function checkOllamaStatus() {
    const dot = document.getElementById('aiStatusDot');
    const select = document.getElementById('aiModelSelect');

    try {
      const resp = await fetch("{% url 'quiz:ai_models' %}");
      const data = await resp.json();
      if (data.success && data.is_running) {
        if (dot) {
          dot.className = 'ai-status-pulse online';
          dot.title = `AI Engine active (${data.default_model || 'brain-ai'})`;
        }
        if (data.default_model) {
          currentAiModel = data.default_model;
        }
        if (select && Array.isArray(data.models)) {
          select.innerHTML = '';
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = m;
            if (m === data.default_model) opt.selected = true;
            select.appendChild(opt);
          });
          if (select.value) currentAiModel = select.value;
        }
      } else {
        if (dot) {
          dot.className = 'ai-status-pulse hybrid';
          dot.title = 'Hybrid AI Engine Ready (Cloud & Smart Solver Active)';
        }
      }
    } catch (e) {
      if (dot) dot.className = 'ai-status-pulse hybrid';
    }
  }

  function changeAiModel(val) {
    currentAiModel = val;
  }

  let isSendingAiMessage = false;

  function handleAiInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleAiChatSubmit(e);
    }
  }

  function sendQuickPrompt(promptText) {
    const input = document.getElementById('aiChatInput');
    if (input) input.value = promptText;
    handleAiChatSubmit(new Event('submit'));
  }

  async function handleAiChatSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (isSendingAiMessage) return;

    const input = document.getElementById('aiChatInput');
    const prompt = input ? input.value.trim() : '';
    if (!prompt) return;

    isSendingAiMessage = true;
    input.value = '';

    const sendBtn = document.getElementById('aiSendBtn');
    if (sendBtn) sendBtn.disabled = true;

    // Add user message to UI & history
    appendMessage('user', prompt);
    aiConversationHistory.push({ role: 'user', content: prompt });
    saveAiChatHistory();

    showTypingIndicator(true);
    scrollToBottom();

    try {
      const csrfToken = getCookie('csrftoken');
      const headers = { 'Content-Type': 'application/json' };
      if (csrfToken) headers['X-CSRFToken'] = csrfToken;

      const resp = await fetch("{% url 'quiz:ai_chat' %}", {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          model: currentAiModel || 'brain-ai',
          messages: aiConversationHistory
        })
      });

      const data = await resp.json();
      showTypingIndicator(false);

      if (data && data.success) {
        const reply = data.response;
        appendMessage('assistant', reply, data.source, true);
        aiConversationHistory.push({ role: 'assistant', content: reply });
        saveAiChatHistory();
      } else {
        const errText = (data && data.error) ? data.error : "Could not generate response.";
        appendMessage('assistant', `⚠️ **Notice**: ${errText}`, null, false);
      }
    } catch (err) {
      showTypingIndicator(false);
      appendMessage('assistant', `⚠️ **Network Notice**: Unable to reach AI engine endpoint.`, null, false);
    } finally {
      isSendingAiMessage = false;
      if (sendBtn) sendBtn.disabled = false;
      if (input) input.focus();
      scrollToBottom();
    }
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function appendMessage(role, content, sourceTag = null, animate = false) {
    const container = document.getElementById('aiChatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `ai-msg ${role}-msg fade-in`;

    const avatarIcon = role === 'user' ? 'fa-user-astronaut' : 'fa-brain';
    let sourceBadge = '';
    if (sourceTag === 'ollama_local') {
      sourceBadge = '<span class="badge bg-success-subtle text-success border border-success font-monospace ms-2 fs-xs"><i class="fas fa-microchip me-1"></i> brain-ai Local</span>';
    } else if (sourceTag === 'cloud_groq') {
      sourceBadge = '<span class="badge bg-info-subtle text-info border border-info font-monospace ms-2 fs-xs"><i class="fas fa-cloud me-1"></i> Llama 3.2 Cloud</span>';
    } else if (role === 'assistant') {
      sourceBadge = '<span class="badge bg-amber-subtle text-amber border border-warning font-monospace ms-2 fs-xs"><i class="fas fa-sparkles me-1"></i> Brain AI Engine</span>';
    }

    if (role === 'assistant' && animate) {
      msgDiv.innerHTML = `
        <div class="msg-avatar-glow"><i class="fas ${avatarIcon}"></i></div>
        <div class="msg-bubble ${role}-bubble">
          <div class="bubble-header d-flex justify-content-between align-items-center mb-1">
            <span class="font-monospace fw-bold fs-xs text-amber"><i class="fas fa-brain me-1"></i> Brain AI ${sourceBadge}</span>
          </div>
          <div class="bubble-text"></div>
          <div class="bubble-actions mt-2 d-flex gap-2 opacity-0">
            <button class="btn btn-xs btn-copy-msg" onclick="copyToClipboard(this, \`${escapeJsText(content)}\`)" title="Copy Answer">
              <i class="fas fa-copy me-1"></i> Copy
            </button>
          </div>
        </div>
      `;
      container.appendChild(msgDiv);

      const bubbleTextEl = msgDiv.querySelector('.bubble-text');
      const actionsEl = msgDiv.querySelector('.bubble-actions');
      const words = content.split(' ');
      let currentWordIndex = 0;
      let currentTextAccumulator = '';

      const typingTimer = setInterval(() => {
        if (currentWordIndex < words.length) {
          currentTextAccumulator += (currentWordIndex === 0 ? '' : ' ') + words[currentWordIndex];
          bubbleTextEl.innerHTML = formatMarkdown(currentTextAccumulator) + '<span class="ai-typing-cursor">▌</span>';
          currentWordIndex++;
          scrollToBottom();
        } else {
          clearInterval(typingTimer);
          bubbleTextEl.innerHTML = formatMarkdown(content);
          if (actionsEl) actionsEl.classList.remove('opacity-0');
          scrollToBottom();
        }
      }, 45);
    } else {
      msgDiv.innerHTML = `
        <div class="msg-avatar-glow"><i class="fas ${avatarIcon}"></i></div>
        <div class="msg-bubble ${role}-bubble">
          ${role === 'assistant' ? `
            <div class="bubble-header d-flex justify-content-between align-items-center mb-1">
              <span class="font-monospace fw-bold fs-xs text-amber"><i class="fas fa-brain me-1"></i> Brain AI ${sourceBadge}</span>
            </div>
          ` : ''}
          <div class="bubble-text">${parsedHtml}</div>
          ${role === 'assistant' ? `
            <div class="bubble-actions mt-2 d-flex gap-2">
              <button class="btn btn-xs btn-copy-msg" onclick="copyToClipboard(this, \`${escapeJsText(content)}\`)" title="Copy Answer">
                <i class="fas fa-copy me-1"></i> Copy
              </button>
            </div>
          ` : ''}
        </div>
      `;
      container.appendChild(msgDiv);
    }
  }

  function showTypingIndicator(show) {
    const el = document.getElementById('aiTypingIndicator');
    if (show) el.classList.remove('d-none');
    else el.classList.add('d-none');
  }

  function scrollToBottom() {
    const container = document.getElementById('aiChatMessages');
    container.scrollTop = container.scrollHeight;
  }

  function clearAiChat() {
    if (confirm('Clear BrainBot AI conversation history?')) {
      aiConversationHistory = [];
      localStorage.removeItem('brainbot_chat_history_v2');
      const container = document.getElementById('aiChatMessages');
      container.innerHTML = `
        <div class="ai-msg assistant-msg fade-in">
          <div class="msg-avatar-glow"><i class="fas fa-robot"></i></div>
          <div class="msg-bubble assistant-bubble">
            <div class="bubble-header d-flex justify-content-between align-items-center mb-1">
              <span class="font-monospace fw-bold fs-xs text-amber"><i class="fas fa-sparkles me-1"></i> BrainBot AI</span>
            </div>
            Chat history cleared! Ready for your next reasoning or aptitude question. 🧠✨
          </div>
        </div>
      `;
    }
  }

  function saveAiChatHistory() {
    try {
      localStorage.setItem('brainbot_chat_history_v2', JSON.stringify(aiConversationHistory.slice(-20)));
    } catch (e) { }
  }

  function loadAiChatHistory() {
    try {
      const saved = localStorage.getItem('brainbot_chat_history_v2');
      if (saved) {
        aiConversationHistory = JSON.parse(saved);
        if (Array.isArray(aiConversationHistory) && aiConversationHistory.length > 0) {
          aiConversationHistory.forEach(m => {
            appendMessage(m.role, m.content, null, false);
          });
        }
      }
    } catch (e) { }
  }

  function formatMarkdown(text) {
    if (!text) return '';
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Display Math $$ ... $$
    html = html.replace(/\$\$([\s\S]*?)\$\$/g, '<div class="math-formula-block">$1</div>');
    // Inline Math $ ... $
    html = html.replace(/\$([^$]+)\$/g, '<strong class="text-amber font-monospace">$1</strong>');

    // ChatGPT Style Fenced Code blocks ```lang ... ```
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
      const language = lang.trim() || 'code';
      return `
        <div class="chatgpt-code-wrapper my-2">
          <div class="chatgpt-code-header font-monospace d-flex justify-content-between align-items-center px-3 py-1">
            <span class="small text-uppercase"><i class="fas fa-code me-1 text-amber"></i>${language}</span>
            <button class="btn-copy-code" type="button" onclick="copyCodeSnippet(this)" title="Copy Code"><i class="fas fa-copy me-1"></i>Copy code</button>
          </div>
          <pre class="ai-code-block m-0 p-3"><code>${code.trim()}</code></pre>
        </div>
      `;
    });

    // Inline code `...`
    html = html.replace(/`([^`]+)`/g, '<code class="ai-inline-code">$1</code>');

    // Headings ### ...
    html = html.replace(/^### (.*$)/gim, '<h6 class="fw-bold text-amber mt-3 mb-2">$1</h6>');
    html = html.replace(/^#### (.*$)/gim, '<strong class="text-info font-monospace d-block mt-2 mb-1">$1</strong>');

    // Bold **...**
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // Italic *...*
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    // Lists
    html = html.replace(/^\s*[-*]\s+(.*$)/gim, '<li class="ms-3 mb-1">$1</li>');
    // Newlines
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  function escapeJsText(str) {
    return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  function copyCodeSnippet(btn) {
    const codeBlock = btn.closest('.chatgpt-code-wrapper').querySelector('code');
    if (codeBlock) {
      navigator.clipboard.writeText(codeBlock.innerText).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check text-success me-1"></i>Copied!';
        setTimeout(() => { btn.innerHTML = original; }, 2000);
      });
    }
  }

  function copyToClipboard(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check text-success me-1"></i> Copied!';
      setTimeout(() => { btn.innerHTML = original; }, 2000);
    });
  }
</script>
